  linux:
    type: streamable-http
    url: http://$${STACK_NAME:-prod}-mcp-linux:3015/mcp
    title: Linux Workspace
    description: Isolated Linux environment with terminal, file upload/download, Git and workspaces
    iconPath: /images/mcp-linux-icon.svg
    initTimeout: 120000
    timeout: 120000
    chatMenu: true
    startup: true
    serverInstructions: true
    headers:
      X-User-ID: '{{LIBRECHAT_USER_ID}}'
      X-User-Username: '{{LIBRECHAT_USER_USERNAME}}'
      X-User-Email: '{{LIBRECHAT_USER_EMAIL}}'
      # Optional override: unset means the header is not sent at all and git keeps running under
      # the shared bot account, so the workspace stays usable for everyone who configures nothing.
      X-User-Github-Pat: '{{GITHUB_PAT}}'
    customUserVars:
      GITHUB_PAT:
        title: Eigener GitHub Token
        description: >-
          Optional. Ohne Token laufen git und `gh` im Linux-Workspace über das gemeinsame
          Bot-Konto. Mit eigenem Token (https://github.com/settings/tokens, klassisch mit Scope
          `repo`) arbeitest du auf deinen eigenen Repos, und Commits erscheinen unter deinem
          Namen. Gilt nur für den Linux-Workspace - für die GitHub-Tools gibt es den Server
          "GitHub eigener Zugang".
        optional: true

  spend:
    type: streamable-http
    url: http://$${STACK_NAME:-prod}-spend-monitor:3016/mcp
    title: Spend Monitor
    description: Org-wide LibreChat spend report and budget enforcement controls (admins only)
    iconPath: /images/mcp-spend-monitor-icon.svg
    initTimeout: 120000
    chatMenu: false
    startup: false
    serverInstructions: true
    headers:
      X-User-ID: '{{LIBRECHAT_USER_ID}}'
      X-User-Username: '{{LIBRECHAT_USER_USERNAME}}'
      X-User-Email: '{{LIBRECHAT_USER_EMAIL}}'

  ytptube:
    type: streamable-http
    url: http://$${STACK_NAME:-prod}-mcp-ytptube:3010/mcp
    title: Video Transcripts
    description: Request video transcripts and check status.
    iconPath: /images/mcp-ytptube-icon.svg
    initTimeout: 120000
    timeout: 300000   # 5 min — downloads + STT
    chatMenu: false
    startup: false # Currently experimental
    serverInstructions: true

  github:
    type: streamable-http
    url: https://api.githubcopilot.com/mcp/
    title: GitHub
    description: Repositories, Issues, Pull Requests und Code-Analyse
    iconPath: /images/mcp-github-icon.svg
    headers:
      Authorization: "Bearer ${MCP_GITHUB_PAT}"
    # Static machine-user PAT, not OAuth - same reason as the `search` server below.
    # Without this, LibreChat probes the URL without the Authorization header, gets a 401 +
    # WWW-Authenticate from GitHub and records `OAuth Required: true`. Every tool call then
    # tries a per-user OAuth flow instead of using the PAT above, and GitHub's auth server
    # has no dynamic client registration, so the flow cannot even start:
    #   Failed to initiate OAuth flow: Incompatible auth server: does not support
    #   dynamic client registration
    #   [MCP][github][pull_request_read] Error calling MCP tool: OAuth authentication failed
    # An explicit value short-circuits the probe (see UserConnectionManager.ts).
    requiresOAuth: false
    initTimeout: 120000
    chatMenu: true
    startup: true
    serverInstructions: true

  # Optional per-user alternative to the shared machine account above. The token is entered
  # by each user in LibreChat's MCP settings and stored encrypted per user; `{{GITHUB_PAT}}`
  # is substituted at connection time. A server whose customUserVars are unset has its tools
  # hidden from the model entirely (upstream #10969), so this simply stays invisible until a
  # user configures it - it cannot break the shared `github` server above.
  github-personal:
    type: streamable-http
    url: https://api.githubcopilot.com/mcp/
    title: GitHub eigener Zugang
    description: GitHub mit deinem persönlichen Token statt des gemeinsamen Bot-Kontos
    iconPath: /images/mcp-github-icon.svg
    headers:
      Authorization: "Bearer {{GITHUB_PAT}}"
    customUserVars:
      GITHUB_PAT:
        title: GitHub Personal Access Token
        description: >-
          Erstellen unter https://github.com/settings/tokens - klassisch mit Scope `repo`
          (und `read:org` für Organisationen). Ersetzt das gemeinsame Bot-Konto, damit Commits
          und Pull Requests unter deinem Namen erscheinen und du Zugriff auf deine eigenen
          Repos hast.
    # Static token, not OAuth - see the note on the `github` server above.
    requiresOAuth: false
    initTimeout: 120000
    chatMenu: true
    # Lazy: without a configured token there is nothing to connect to.
    startup: false
    serverInstructions: true

  mapbox:
    type: streamable-http
    url: https://mcp.mapbox.com/mcp
    title: Mapbox
    description: Geographic search, route planning, geocoding and map visualization
    iconPath: /images/mcp-mapbox-icon.svg
    headers:
      Authorization: "Bearer ${MCP_MAPBOX_ACCESS_TOKEN}"
    initTimeout: 120000
    timeout: 150000
    chatMenu: true
    # mcp.mapbox.com requires its own per-user OAuth regardless of the bearer header above.
    # Operator-configured MCP servers are global (connected regardless of which agent/tools
    # a turn actually uses), so startup:true made ANY agent turn - even ones with no use for
    # Mapbox - block on this OAuth requirement. startup:false makes the connection lazy: it
    # only triggers (and only blocks) when a turn actually calls a Mapbox tool.
    startup: false
    serverInstructions: true

  search:
    type: streamable-http
    url: ${SEARCH_MCP_URL}
    title: Search
    description: Search German fact-checks from Faktenforum; hybrid semantic and full-text search
    iconPath: /images/mcp-search-icon.svg
    headers:
      Authorization: "Bearer ${SEARCH_MCP_API_KEY}"
    # Static admin-managed Bearer key, not OAuth. Without this, LibreChat's startup
    # OAuth probe hits the URL with no Authorization header, gets a 401 + WWW-Authenticate
    # challenge from the search API, and misclassifies the server as requiring OAuth -
    # which skips the real (authenticated) inspection, so capabilities/tools never load
    # and the Faktencheck agent has no working tools.
    requiresOAuth: false
    initTimeout: 120000
    chatMenu: true
    startup: true
    serverInstructions: true


# OCR Configuration (Optical Character Recognition)
# Requires: LIBRECHAT_OCR_API_KEY environment variable set with your Mistral API key
ocr:
  mistralModel: "mistral-ocr-latest"
  apiKey: "${OCR_API_KEY}"
  baseURL: "${OCR_BASEURL}"
  strategy: "mistral_ocr"

# File Configuration
# Using defaults from codebase (defaultOCRMimeTypes, defaultTextMimeTypes) which cover:
# - OCR: images, PDF, DOCX, PPTX, XLSX/XLS, EPUB, ODS/ODT/ODP/ODG, DOC/PPT (legacy)
# - Text: all MIME types (wildcard match)
# - Local document_parser (v0.8.3+) handles PDF/DOCX/XLSX/XLS/ODS without Mistral API
# fileConfig:

  stt:
    # Audio formats supported by Azure OpenAI STT and other STT providers
    # Formats: flac, mp3, mp4, mpeg, mpga, m4a, ogg, wav, webm, aac, opus, wma
    supportedMimeTypes:
      - "^audio/(mp3|mpeg|mpeg3|mp4|m4a|mpga|wav|wave|x-wav|ogg|vorbis|webm|flac|x-flac|aac|wma|opus)$"

# File Strategy (Granular) - disabled (default: "local" for all file types)
# Allows different storage strategies for different file types
# If not specified, all file types default to "local"
# Priority: specific type > fileStrategies.default > fileStrategy > "local"
# Available strategies: "local", "s3", "firebase", "azure_blob"
fileStrategies:
  default: "local"
  avatar: "local"
  image: "local"
  document: "local"
