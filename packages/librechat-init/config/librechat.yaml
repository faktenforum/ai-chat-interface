  chefkoch:
    type: streamable-http
    url: http://$${STACK_NAME:-prod}-mcp-chefkoch:3014/mcp
    title: Recipes
    description: Search and display recipes from Chefkoch.de
    iconPath: /images/mcp-chefkoch-icon.svg
    initTimeout: 120000
