  npm-search:
    type: streamable-http
    url: http://$${STACK_NAME:-prod}-mcp-npm-search:3009/mcp
    title: npm Search
    description: Search and find npm packages
    iconPath: /images/mcp-npm-search-icon.svg
    initTimeout: 120000
